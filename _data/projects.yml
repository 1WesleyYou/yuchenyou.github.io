  - title: Cuda Proxy Player
    group: course
    org: UMich CSE 582 · Advanced Operating Systems
    period: Aug – Dec 2025
    advisor: Prof. Ryan Huang
    advisor_url: https://web.eecs.umich.edu/~ryanph
    image: cpp_workflow.png
    image_width: 1142
    image_height: 591
    summary: A hybrid CUDA runtime that mixes CUDA Graphs with persistent kernels to cut launch overhead for MoE.
    tags: [CUDA Graphs, Persistent Kernels, MoE, Streams]
    bullets:
      - "Designed a **hybrid CUDA runtime** combining **CUDA Graphs** for stable compute paths and **persistent kernels** for irregular on-device tasks."
      - "Reduced **kernel launch overhead** and **tail latency** without brittle fusion, enabling dynamic routing and static graph reuse."
      - "Implemented bucket-based static pooling, piecewise graph capture, and stream-level synchronization for efficient MoE execution."

  - title: Cloud VLM for AV Control
    group: course
    org: UMich CSE 589 · Advanced Networking
    period: Aug – Dec 2025
    advisor: Prof. Z. Morley Mao
    advisor_url: https://web.eecs.umich.edu/~zmao/
