  - title: Simulated Basic Operating System
    group: course
    org: UMich EECS 482 · Introduction to Operating Systems
    period: Jan – Apr 2025
    summary: Threads, a pager with copy-on-write, and an inode-based network file system built from scratch.
    tags: [Threads, Pager/MMU, COW, Clock Eviction, NFS, Boost]
    bullets:
      - "**Threads:** user-level thread library (`swapcontext`/`makecontext`), Mesa monitors; interrupts/core-suspend; **non-preemptive FIFO** run queues. Supports multiprocessor systems."
      - "**Pager/MMU:** SWAP & FILE-backed pages; page tables with present/reference/dirty bits; **COW** lazy copying + **Clock** eviction; supports `fork`/`mmap` for a non-empty arena."
      - "**Network File System:** inode-based, Unix-style NFS; concurrency with Boost `shared`/`unique` locks and hand-over-hand locking."

  - title: Networks
    group: course
    org: UMich EECS 489 · Introduction to Networks
    period: Jan – Apr 2025
    summary: Mininet measurements, a DASH video proxy, a sliding-window transport and an L3 router.
    tags: [Mininet, iperf, DASH, Reverse Proxy, GBN/SR, ARP/ICMP]
    bullets:
      - "**Mininet-style iperf:** custom Mininet topologies (Python) with iperf-style RTT/throughput measurement (C++ sockets); reproduced **buffer-bloat** with long switch queues and asymmetric links, then fixed it with OVS SDN control and two prioritized queues (this part belongs to the CSE 589 project)."
      - "**Video server emulation:** **reverse proxy** via `select`+`poll` with round-robin load balancing; **DASH** adaptive streaming."
      - "**Transport layer emulation:** TCP **sliding window** over a UDP-style protocol (**GBN/SR**, cumulative/selective ACKs)."
      - "**L3 router** simulation with ARP, ICMP and basic intra-domain routing."

  - title: Security
    group: course
    org: UMich EECS 388 · Introduction to Computer Security
    period: Jan – Apr 2025
    summary: Forensics, cryptanalysis, web exploitation, binary attacks and reverse engineering, hands on.
    tags: [Forensics, Padding Oracle, XSS/SQLi/CSRF, ROP, Ghidra, gdb]
    bullets:
      - "**Digital forensics:** disk image analysis, file carving, metadata extraction with **steganographic tools**."
      - "**Cryptanalysis & cracking:** length-extension, padding-oracle; John the Ripper (encrypted PDF/ODT), Hydra (SSH)."
      - "**Web exploitation:** auth bypass via **XSS/SQLi/CSRF**; wrote a small \"Samy-is-My-Hero\" worm."
      - "**Binary attacks:** x86 assembly analysis and exploit development with `gdb`; stack overflows, **ROP chains**, and bypassing ASLR and stack canaries."
      - "**Reverse engineering:** recovered C logic from executables with **Ghidra** and static analysis; combined with pwning to hack the UMich BBB building's stair light."

