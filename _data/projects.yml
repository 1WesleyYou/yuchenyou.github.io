projects:
  - title: Agentic Distributed System Overload Mitigation
    group: featured
    org: Order Lab @ UMich
    org_url: https://orderlab.io/
    period: May 2024 – Present
    advisor: Ryan Huang
    advisor_url: https://web.eecs.umich.edu/~ryanph/
    image: agent_ds_ops.png
    image_width: 1536
    image_height: 1024
    summary: Closed-loop, policy-driven and LLM-augmented overload mitigation for ZooKeeper clusters.
    tags: [ZooKeeper, Prometheus, HAProxy, tc, JVM, zkbench, MCP, GPT-4.1]
    bullets:
      - "**Closed-loop control plane:** engineered a closed-loop control plane for **ZooKeeper** clusters to mitigate overload failure, integrating **Prometheus** telemetry and **HAProxy** / `tc` for traffic shaping."
      - "**Mitigation / RCA action library:** implemented a library of **atomic mitigation actions**, including network throttling (`tcconfig`), dynamic load balancing (**HAProxy Runtime API**), **JVM** heap tuning and disk I/O control (`fsync`), packaged as auditable scripts that any controller can invoke safely."
      - "**Load injection & evaluator:** built a custom load generator (zkbench) supporting **multi-stage traffic** (warmup → spike → cooldown) to stress-test resilience, and a closed-loop evaluator that correlates injection rates, SLO violations and goodput across control strategies."
      - "**Agentic controller:** prototyped a **Claude Code styled controller** (GPT-4.1 with **Model Context Protocol** tools) that consumes metrics and log summaries to do root cause analysis and select mitigation actions, enabling comparison between static policies and agentic reasoning on complex failure patterns; tuned context-window usage with a log processor to cut the number of cycles."

  - title: Search Engine "Crawl Me Maybe" in C++
    group: featured
    org: UMich EECS 498 · System Design for Search Engine
    period: Jan – Apr 2026
    advisor: Nicole Hamilton
    advisor_label: Instructor
    advisor_url: https://nicolehamilton.com/
    video_embed: https://drive.google.com/file/d/1NyLpX0U7HRUOjDJ0SezyaaAhicHxemop/preview
    video_url: https://drive.google.com/file/d/1NyLpX0U7HRUOjDJ0SezyaaAhicHxemop/view?usp=sharing
    image: crawl_me_maybe.png
    image_width: 713
    image_height: 810
    summary: A complete web search engine built from scratch in C++ by a team of four, crawling 210M pages and serving queries from a 1 TB inverted index on 20 GCP servers.
    tags: [C++20, Inverted Index, mmap, VByte, Skip Lists, Constraint Solver, BM25, GCP]
    bullets:
      - "**Product demo:** built a complete search engine in a team of 4; crawled **210M websites** within 2 days, indexed into a **1 TB inverted index**, average query time **200 ms** with p99 tail latency of 4 s, distributed across 20 GCP servers."
      - "**Inverted index read-write storage system:** hierarchical storage design using `mmap` for disk I/O, **UTF-8 + VByte** encoding and a **string pool** for variable-length strings; implemented a **recursive skip-list** tree and **position-list cursor** for fast posting-list walks; high-concurrency multithreading and a **zero-copy data path** that made index writing compute-bound."
      - "**Constraint solver design:** contributed a recursive constraint-solver tree built from the query compiler's AST, with submatching and merging; supports **AND / OR / Phrase / NOT** logic."
      - "**Ranker design:** contributed a benchmark of ~100 hot query terms against Google/Bing and tuned the dynamic ranker weights, including BM25 tf-idf, domain-name matching and last-path matching."

